name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q stock_chaussures.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Preparer le projet
        working-directory: stock_chaussures
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/m.xml
          flutter create . --project-name stock_chaussures --platforms android
          cp /tmp/m.xml android/app/src/main/AndroidManifest.xml
          flutter pub get
      - name: Compiler
        working-directory: stock_chaussures
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: stock_chaussures/build/app/outputs/flutter-apk/app-release.apk
